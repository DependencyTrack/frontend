name: Publish CI

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions: {}

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Assert ref type
        run: |-
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::Publishing is only supported for tags!"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false

      - name: Parse Version from package.json
        id: parse
        run: |-
          VERSION=`jq -r '.version' package.json`
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  call-build:
    needs:
      - read-version
    uses: ./.github/workflows/_meta-build.yaml
    with:
      app-version: ${{ needs.read-version.outputs.version }}
      publish-container: true
      ref-name: ${{ github.ref_name }}
    permissions:
      artifact-metadata: write # Required to create the artifact storage record.
      attestations: write # Required to generate SLSA build provenance.
      id-token: write # Required for keyless signing of SLSA build provenance.
    secrets:
      registry-0-usr: ${{ secrets.DOCKER_HUB_USERNAME }}
      registry-0-psw: ${{ secrets.DOCKER_HUB_TOKEN }}

  update-github-release:
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write # Required to create the artifact storage record.
      attestations: write # Required to generate SLSA build provenance.
      contents: write # Required to edit release.
      id-token: write # Required for keyless signing of SLSA build provenance.
    needs:
      - read-version
      - call-build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # tag=v8.0.1
        with:
          name: assembled-frontend

      - name: Create Checksums
        run: |-
          zip -qr frontend-dist.zip dist/*

          echo "# SHA1" >> checksums.txt
          sha1sum frontend-dist.zip >> checksums.txt
          echo "# SHA256" >> checksums.txt
          sha256sum frontend-dist.zip >> checksums.txt
          echo "# SHA512" >> checksums.txt
          sha512sum frontend-dist.zip >> checksums.txt

      - name: Generate SLSA Build Provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # tag=v4.2.2
        with:
          subject-path: |-
            frontend-dist.zip
            bom.json
            bom.xml

      - name: Prepare SLSA Build Provenance Asset
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |-
          cp "${BUNDLE_PATH}" frontend-dist.zip.intoto.jsonl

      - name: Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.read-version.outputs.version }}
        run: |-
          cat << EOF >> .github/default-release-notes.md
          \`\`\`text
          $(cat checksums.txt)
          \`\`\`
          EOF

          gh release view "${RELEASE_VERSION}" \
            --json body --jq .body >> .github/default-release-notes.md

          gh release edit "${RELEASE_VERSION}" \
            --notes-file ".github/default-release-notes.md"

          gh release upload "${RELEASE_VERSION}" \
            --clobber \
            frontend-dist.zip \
            frontend-dist.zip.intoto.jsonl \
            checksums.txt \
            bom.xml bom.json

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.read-version.outputs.version }}
        run: |-
          gh release edit "${RELEASE_VERSION}" \
            --latest=false \
            --draft=false
