<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Dependency-Track</title>
    <base href=/ >
    <script type="text/javascript">
      (function () {
        // Runs before the app loads, so the first paint already uses the right theme.
        var theme = localStorage.getItem('Theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark';
        }
        document.documentElement.setAttribute('data-bs-theme', theme);
      })();
    </script>
  </head>
  <body class="sidebar-minimized">
    <noscript>
      <strong
        >We're sorry but this app doesn't work properly without JavaScript
        enabled. Please enable it to continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script type="text/javascript">
      (function () {
        if (!sessionStorage.length) {
          // Ask other tabs for session storage
          localStorage.setItem('getSessionStorage', Date.now());
        }
        window.addEventListener('storage', function (event) {
          if (event.key == 'getSessionStorage') {
            // Some tab asked for the sessionStorage -> send it
            localStorage.setItem(
              'sessionStorage',
              JSON.stringify(sessionStorage),
            );
            localStorage.removeItem('sessionStorage');
          } else if (event.key == 'sessionStorage' && !sessionStorage.length) {
            // sessionStorage is empty -> fill it
            var data = JSON.parse(event.newValue),
              value;
            for (key in data) {
              sessionStorage.setItem(key, data[key]);
            }
          } else if (event.key == 'sessionInvalidate') {
            // clearing out session in the event a user clicks the logout button
            sessionStorage.clear();
            location.reload();
          }
        });
      })();
    </script>
  </body>
</html>
